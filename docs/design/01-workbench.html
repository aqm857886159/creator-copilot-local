<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作台 · 设计样张</title>
<style>
:root{
  --ground:#F4F5F3; --card:#FFFFFF; --slate:#22252B; --slate2:#3A3E45;
  --ink2:#62666D; --ink3:#9EA2A8; --line:#E3E4E1;
  --marker:#FFD84D; --record:#E0442E;
  --sans:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ground)}
body{font-family:var(--sans);font-size:14px;line-height:1.6;color:var(--slate);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--slate);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ===== shell ===== */
.top{height:56px;display:flex;align-items:center;gap:26px;padding:0 28px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand i{width:30px;height:30px;border-radius:8px;background:var(--slate);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:15px}
.brand b{font-weight:700;font-size:16px;letter-spacing:.02em}
.nav{display:flex;gap:4px}
.nav a{padding:7px 13px;border-radius:8px;color:var(--ink2);text-decoration:none;font-size:14px}
.nav a:hover{background:#eaebe8;color:var(--slate)}
.nav a[aria-current]{color:var(--slate);font-weight:600;box-shadow:inset 0 -2px 0 var(--marker)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:16px;font-size:13px;color:var(--ink2)}
.ws{display:flex;align-items:center;gap:7px}

.page{max-width:1120px;margin:0 auto;padding:34px 28px 60px}
.sec{display:flex;align-items:baseline;gap:12px;margin:10px 0 18px}
.sec h1{font-size:22px;font-weight:700;letter-spacing:.01em}
.sec small{font-size:13px;color:var(--ink2)}
.sec2{margin-top:44px}

/* ===== 9:16 项目卡 ===== */
.row{display:grid;grid-template-columns:repeat(auto-fill,208px);gap:18px}
.proj{width:208px;aspect-ratio:9/16;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;text-align:left;padding:0;transition:transform .15s ease,box-shadow .15s ease}
.proj:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(34,37,43,.13)}
.cover{flex:1 1 58%;min-height:0;background:var(--slate);color:#fff;padding:18px 16px;display:flex;flex-direction:column}
.cover .tag{font-size:11px;color:#9EA2A8;letter-spacing:.14em}
.cover h2{margin-top:auto;font-size:21px;font-weight:700;line-height:1.42;letter-spacing:.01em}
.cover h2 mark{background:var(--marker);color:var(--slate);padding:0 4px;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.meta{flex:0 0 auto;padding:13px 15px 15px;display:flex;flex-direction:column;gap:10px}
.stages{display:flex;gap:4px}
.stages i{height:4px;flex:1;border-radius:2px;background:var(--line);font-style:normal}
.stages i.done{background:var(--slate)}
.stages i.now{background:var(--marker)}
.next{font-size:13px;color:var(--ink2);line-height:1.55;min-height:40px}
.next b{color:var(--slate);font-weight:600}
.next .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--record);margin-right:6px;vertical-align:1px}
.go{align-self:flex-start;padding:7px 14px;border-radius:8px;background:var(--slate);color:#fff;font-size:13px;font-weight:600}
.go:hover{background:var(--slate2)}

/* 新片卡 */
.proj.new{border-style:dashed;border-color:#C9CBC6;background:transparent;align-items:center;justify-content:center;gap:12px;color:var(--ink2)}
.proj.new:hover{border-color:var(--ink2);box-shadow:none;transform:none;background:#fbfbfa}
.new-main{display:flex;flex-direction:column;align-items:center;gap:12px;padding:0}
.proj.new .plus{width:44px;height:44px;border-radius:50%;border:1.5px solid #C9CBC6;display:grid;place-items:center;font-size:20px;color:var(--ink3)}
.proj.new p{font-size:13px;text-align:center;line-height:1.65;padding:0 20px}
.proj.new p b{display:block;color:var(--slate);font-size:14px;font-weight:600;margin-bottom:2px}
.proj.new .alt{font-size:12px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.proj.new .alt:hover{color:var(--slate)}

/* ===== 等你定 ===== */
.ask{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.ask-i{display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid var(--line)}
.ask-i:last-child{border-bottom:0}
.ask-i .sig{flex:0 0 8px;width:8px;height:8px;border-radius:50%}
.sig.hot{background:var(--record)}
.sig.pay{background:var(--marker);box-shadow:0 0 0 1px #E4BC28 inset}
.ask-b{min-width:0;flex:1}
.ask-b b{display:block;font-size:14px;font-weight:600}
.ask-b span{display:block;font-size:13px;color:var(--ink2);margin-top:2px}
.ask-i .at{font-family:var(--mono);font-size:12px;color:var(--ink2);white-space:nowrap}
.act{flex:0 0 auto;display:flex;align-items:center;gap:10px}
.act .main{padding:7px 14px;border-radius:8px;background:var(--slate);color:#fff;font-size:13px;font-weight:600}
.act .main:hover{background:var(--slate2)}
.act .quiet{font-size:13px;color:var(--ink2)}
.act .quiet:hover{color:var(--slate);text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><i>原</i><b>原点</b></div>
  <nav class="nav" aria-label="主导航">
    <a href="#" aria-current="page">工作台</a>
    <a href="#">选题</a>
    <a href="#">素材库</a>
    <a href="#">记忆</a>
  </nav>
  <div class="top-r">
    <span class="ws">数据在本机</span>
    <button>设置</button>
  </div>
</header>

<main class="page">
    <div class="sec"><h1>接着做</h1><small>3 个进行中</small></div>

  <div class="row">

    <div class="proj new">
      <button class="new-main">
        <span class="plus">＋</span>
        <p><b>拍好了就扔进来</b>AI 转写、剪掉磕巴和重来，<br>直接给你一版粗剪</p>
      </button>
      <button class="alt">想从头规划一条 →</button>
    </div>

    <button class="proj">
      <span class="cover">
        <span class="tag">剪辑中 · 粗剪 38s</span>
        <h2>越努力，<br>越没<mark>记忆点</mark>？</h2>
      </span>
      <span class="meta">
        <span class="stages"><i class="done"></i><i class="done"></i><i class="done"></i><i class="now"></i><i></i></span>
        <span class="next"><span class="dot"></span><b>一处等你定</b> —— 有句话没画面能证明</span>
        <span class="go">继续剪辑</span>
      </span>
    </button>

    <button class="proj">
      <span class="cover">
        <span class="tag">拍摄中</span>
        <h2>素材库不是仓库，<br>是<mark>第二个大脑</mark></h2>
      </span>
      <span class="meta">
        <span class="stages"><i class="done"></i><i class="done"></i><i class="now"></i><i></i><i></i></span>
        <span class="next">手机已拍 <b class="num">3/8</b> 个镜头，下一镜是桌面俯拍</span>
        <span class="go">看拍摄进度</span>
      </span>
    </button>

    <button class="proj">
      <span class="cover">
        <span class="tag">脚本中</span>
        <h2>先讲<mark>结论</mark>，<br>还是先讲故事？</h2>
      </span>
      <span class="meta">
        <span class="stages"><i class="now"></i><i></i><i></i><i></i><i></i></span>
        <span class="next">结尾两段还没写完，画面需求 AI 会顺手标好</span>
        <span class="go">继续写脚本</span>
      </span>
    </button>

  </div>

  <div class="sec sec2"><h1>等你定</h1><small>2 件，都一句话的事</small></div>

  <div class="ask">
    <div class="ask-i">
      <span class="sig hot"></span>
      <span class="ask-b">
        <b>「越努力，越没记忆点？」缺一个画面</b>
        <span>你说了「看见桌面上的草稿」，12 条素材里没有拍到草稿的画面</span>
      </span>
      <span class="at">剪辑 00:08 处</span>
      <span class="act"><button class="main">去处理</button></span>
    </div>
    <div class="ask-i">
      <span class="sig pay"></span>
      <span class="ask-b">
        <b>扫描「AI 工具测评」要花 ¥0.32</b>
        <span>抖音和微博两个来源，预计拿到约 40 个候选选题</span>
      </span>
      <span class="at">报价 10 分钟内有效</span>
      <span class="act"><button class="main">开始扫描 ¥0.32</button><button class="quiet">放弃</button></span>
    </div>
  </div>
</main>

</body>
</html>
